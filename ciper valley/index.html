<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Valley</title>

    <style>
        html, body, #game-container {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #101820;
        }

        #game-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #new-game-button {
            position: fixed;
            top: 16px;
            right: 18px;
            z-index: 1000;
            padding: 11px 18px;
            border: 2px solid #7cffb2;
            border-radius: 8px;
            background: #183d32;
            color: white;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        #new-game-button:hover {
            background: #28634d;
        }
    </style>
</head>

<body>

    <main id="game-container"></main>

    <button id="new-game-button">NEW GAME</button>

    <script src="libs/phaser.js"></script>
    <script src="linked_list.js"></script>
    <script src="hash_table.js"></script>
    <script src="stack_module.js"></script>
    <script src="queue_module.js"></script>
    <script src="tree_module.js"></script>
    <script src="vending_module.js"></script>

    <script src="C++/quest_module.js"></script>
    <script src="C++/player_module.js"></script>
    <script src="C++/world_module.js"></script>

    <script src="game.js?v=room-rpg-ui-12"></script>

    <script>
    document.getElementById("new-game-button")
        .addEventListener("click", function () {

            const confirmed = confirm(
                "Start a new adventure?\n\nYour existing game progress will be erased."
            );

            if (!confirmed) return;

            window.__cipherValleyStartingNewGame = true;
            localStorage.removeItem("cipher-valley-save-v1");
            window.location.reload();
        });
</script>

</body>
</html>
